name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Fail with setup guidance if Pages is not enabled
        if: steps.pages.outcome != 'success'
        run: |
          echo "::error::GitHub Pages 尚未由倉庫擁有者啟用，或 Actions 權限不足。"
          echo "請開啟 https://github.com/amjin358-svg/jin/settings/pages"
          echo "Source 選 Deploy from a branch（main / root）或 GitHub Actions。"
          echo "若用 GitHub Actions：Settings → Actions → General → Workflow permissions → Read and write。"
          exit 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
