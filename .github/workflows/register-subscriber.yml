name: Register weather subscriber

on:
  workflow_dispatch:
    inputs:
      email:
        description: Subscriber email
        required: true
        type: string
      city:
        description: City name (e.g. 臺南市)
        required: true
        type: string
      township:
        description: Township name (e.g. 南區)
        required: false
        default: ""
        type: string
      lat:
        description: Latitude
        required: true
        type: string
      lon:
        description: Longitude
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: register-weather-subscriber
  cancel-in-progress: false

jobs:
  upsert-subscriber:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upsert subscriber JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/subscribers.json';
            const email = String('${{ inputs.email }}').trim().toLowerCase();
            const city = String('${{ inputs.city }}').trim();
            const township = String('${{ inputs.township }}').trim();
            const lat = Number('${{ inputs.lat }}');
            const lon = Number('${{ inputs.lon }}');
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
              throw new Error('Invalid email');
            }
            if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
              throw new Error('Invalid coordinates');
            }
            let doc = { updatedAt: null, subscribers: [] };
            try {
              doc = JSON.parse(fs.readFileSync(path, 'utf8'));
            } catch (_) {}
            const list = Array.isArray(doc.subscribers) ? doc.subscribers : [];
            const record = {
              email,
              topics: ['weather'],
              city,
              township,
              lat,
              lon,
              updatedAt: new Date().toISOString()
            };
            const next = [
              ...list.filter((item) => String(item?.email || '').trim().toLowerCase() !== email),
              record
            ];
            const payload = {
              updatedAt: new Date().toISOString(),
              subscribers: next
            };
            fs.writeFileSync(path, JSON.stringify(payload, null, 2) + '\n');
            console.log(`Upserted ${email}; total=${next.length}`);

      - name: Commit subscribers file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/subscribers.json
          if git diff --staged --quiet; then
            echo "No subscriber changes"
            exit 0
          fi
          git commit -m "chore: upsert weather subscriber ${{ inputs.email }}"
          git push
